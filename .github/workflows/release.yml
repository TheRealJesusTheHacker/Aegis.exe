name: release
# Tag-gated: pushing a v* tag builds and publishes the release.
# workflow_dispatch runs the SAME steps as a proof run and uploads
# the assets as build artifacts only — it never creates a release.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-build.txt
      - name: Version triangulation (package == spec == tag when tagged)
        shell: python
        run: |
          import re, os
          pkg = re.search(r'__version__ = "([^"]+)"', open("aegis/__init__.py").read()).group(1)
          spec = open("packaging/Aegis.spec").read()
          assert f'"{pkg}"' in spec and f"({pkg.replace('.', ', ')}, 0)" in spec, "spec version drift"
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v"):
              assert ref == f"refs/tags/v{pkg}", f"tag {ref} != package {pkg}"
          print("version triangulation OK:", pkg)
      - name: Full suite (offscreen, Windows)
        run: python -m pytest tests/ -q
        env: { QT_QPA_PLATFORM: offscreen }
      - name: PyInstaller build
        run: pyinstaller packaging/Aegis.spec --noconfirm
      - name: Warn-file gate
        shell: python
        run: |
          import pathlib
          warn = pathlib.Path("build/Aegis/warn-Aegis.txt")
          text = warn.read_text() if warn.exists() else ""
          allowed = ("aegis", "packaging")
          bad = [l for l in text.splitlines() if "missing module named" in l and not any(a in l for a in allowed)]
          assert not bad, "unexpected missing modules:\n" + "\n".join(bad[:20])
          print("warn gate OK")
      - name: Staged-exe launch smoke test
        run: dist/Aegis/Aegis.exe --self-check
      - name: Portable edition + checksums
        shell: python
        run: |
          import hashlib, subprocess, sys
          subprocess.run([sys.executable, "tools/build_portable.py", "dist/Aegis", "AegisPortable.zip"], check=True)
          assets = ["dist/Aegis/Aegis.exe", "AegisPortable.zip"]
          lines = []
          for a in assets:
              data = open(a, "rb").read()
              name = "Aegis.exe" if a.endswith("Aegis.exe") else a
              lines.append(f"{hashlib.sha256(data).hexdigest()}  {name}")
          open("SHA256SUMS.txt", "w").write("\n".join(lines) + "\n")
          print("\n".join(lines))
      - uses: actions/upload-artifact@v4
        with: { name: aegis-assets, path: "dist/Aegis/Aegis.exe\nAegisPortable.zip\nSHA256SUMS.txt" }
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/Aegis/Aegis.exe\nAegisPortable.zip\nSHA256SUMS.txt"
