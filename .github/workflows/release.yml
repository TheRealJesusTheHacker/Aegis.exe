name: release
# Tag-gated: pushing a v* tag builds and publishes the release.
# workflow_dispatch runs the SAME steps as a proof run and uploads
# the assets as build artifacts only — it never creates a release.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-build.txt
      - name: Version triangulation (package == spec == tag when tagged)
        shell: python
        run: |
          import re, os
          pkg = re.search(r'__version__ = "([^"]+)"', open("aegis/__init__.py").read()).group(1)
          spec = open("packaging/Aegis.spec").read()
          assert f'"{pkg}"' in spec and f"({pkg.replace('.', ', ')}, 0)" in spec, "spec version drift"
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v"):
              assert ref == f"refs/tags/v{pkg}", f"tag {ref} != package {pkg}"
          print("version triangulation OK:", pkg)
      - name: Full suite (offscreen, Windows)
        run: python -m pytest tests/ -q
        env: { QT_QPA_PLATFORM: offscreen }
      - name: KDF measurement (Windows runner)
        shell: python
        run: |
          import sys, time
          sys.path.insert(0, ".")
          from aegis.kdf import DEFAULT_PARAMS, derive_key
          start = time.perf_counter()
          derive_key(b"synthetic measurement secret", b"\x01" * 16, DEFAULT_PARAMS)
          print("Argon2id RFC 9106 (64 MiB / t3 / p4) on windows-latest: %.3fs" % (time.perf_counter() - start))
      - name: PyInstaller build
        run: pyinstaller packaging/Aegis.spec --noconfirm
      - name: Warn-file gate
        shell: python
        run: |
          import pathlib, re
          # Exact watchlist (verified against the v1.0.0 proof
          # build): Unix-only standard-library names, Java
          # bridges, one frozen-importlib internal, and
          # pythoncom/win32com — the optional Start Menu shortcut
          # helper, imported lazily and guarded in
          # packaging/install.py. Anything else fails the gate.
          WATCHLIST = {
              "'java.lang'", "_frozen_importlib_external",
              "_posixsubprocess", "_winreg", "fcntl", "grp", "java",
              "posix", "pwd", "pythoncom", "resource", "vms_lib",
              "win32com",
          }
          warn = pathlib.Path("build/Aegis/warn-Aegis.txt")
          text = warn.read_text() if warn.exists() else ""
          found = set(re.findall(r"missing module named (\S+)", text))
          bad = found - WATCHLIST
          assert not bad, "unexpected missing modules: %s" % sorted(bad)
          print("warn gate OK; watchlisted:", sorted(found))
      - name: Staged-exe launch smoke test
        run: dist/Aegis/Aegis.exe --self-check
      - name: Staged-exe real launch, portable and installed layouts (offscreen)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          function Test-Launch($exe) {
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 6
            if ($p.HasExited) { throw "Aegis exited early from $exe (code $($p.ExitCode))" }
            Stop-Process -Id $p.Id -Force
            Write-Host "real launch OK: $exe"
          }
          # Portable layout: not the installed home, so the
          # first-run install offer is scheduled in the frozen
          # build as well — the launch must still reach and hold
          # its first window.
          Test-Launch "dist/Aegis/Aegis.exe"
          # Installed layout: the same build copied into the
          # installed home its detection computes, where no
          # offer is due.
          $root = Join-Path $env:RUNNER_TEMP "aegis-fake-programs"
          $dest = Join-Path $root "Aegis"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item -Recurse "dist/Aegis" $dest
          $env:AEGIS_INSTALL_ROOT = $root
          Test-Launch (Join-Path $dest "Aegis.exe")
      - name: Portable edition + checksums
        shell: python
        run: |
          import hashlib, subprocess, sys
          subprocess.run([sys.executable, "tools/build_portable.py", "dist/Aegis", "AegisPortable.zip"], check=True)
          assets = ["dist/Aegis/Aegis.exe", "AegisPortable.zip"]
          lines = []
          for a in assets:
              data = open(a, "rb").read()
              name = "Aegis.exe" if a.endswith("Aegis.exe") else a
              lines.append(f"{hashlib.sha256(data).hexdigest()}  {name}")
          open("SHA256SUMS.txt", "w").write("\n".join(lines) + "\n")
          print("\n".join(lines))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: aegis-assets, path: "dist/Aegis/Aegis.exe\nAegisPortable.zip\nSHA256SUMS.txt" }
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: "dist/Aegis/Aegis.exe\nAegisPortable.zip\nSHA256SUMS.txt"
