name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Qt system libraries (Linux runners ship without them)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq || true; sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - run: pip install --require-hashes -r requirements.lock.txt -r requirements-build.lock.txt
      - run: python -m pytest tests/ -q
        env: { QT_QPA_PLATFORM: offscreen }
