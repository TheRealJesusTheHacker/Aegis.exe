name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Qt system libraries (Linux runners ship without them)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: python -m pytest tests/ -q
        env: { QT_QPA_PLATFORM: offscreen }
